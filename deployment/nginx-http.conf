server {
    listen 80;
    listen [::]:80;

    server_name www.neuradix.com;

    root /var/www/neuradix_website/site;
    index index.html;

    access_log /var/log/nginx/neuradix.access.log;
    error_log  /var/log/nginx/neuradix.error.log;

    # Let's Encrypt HTTP-01 challenge. The ^~ modifier is important: it
    # prevents the hidden-file deny regex below from intercepting .well-known.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Deny other hidden files/directories while allowing ACME above.
    location ~ /\. {
        deny all;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
